name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Unit tests (lib/) — no network, no credentials
        run: npm test

      # Must be one step: a background job (&) started in one GitHub Actions
      # step does not survive into the next step — the runner cleans up each
      # step's process tree when it exits, nohup or not. Start, wait, and
      # run the round trip all in this single shell so the server stays up
      # for the whole thing.
      # curl/node target 127.0.0.1 explicitly, not "localhost": on some
      # runners "localhost" resolves IPv6 (::1) first, which fails fast and
      # silently over and over if the stack isn't dual-homed there — that
      # was the actual cause of this step timing out despite the server's
      # own log proving it had started. --max-time keeps one hung request
      # from silently eating the whole retry budget.
      - name: End-to-end MCP round trip against a local dev server
        run: |
          node scripts/dev-server.js > dev-server.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 -X POST http://127.0.0.1:3002/api/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "dev server never became ready" >&2
            cat dev-server.log
            exit 1
          fi
          npm run test:mcp

      - name: Show dev server log on failure
        if: failure()
        run: cat dev-server.log
